<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Touch Button</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <p class="eyebrow">Real Touch</p>
        <h1>Soft pressure. Real feedback.</h1>
        <p class="copy">
          A gentle button that follows your finger on mobile and your cursor on the web,
          using pressure and press duration to create a more physical feel.
        </p>

        <button class="touch-button" type="button" aria-label="Experience the real touch button">
          <span class="touch-button__surface">
            <span class="touch-button__label">Press softly</span>
            <span class="touch-button__hint">Hold to feel the depth</span>
          </span>
        </button>
      </section>
    </main>

    <script type="module" src="./script.js"></script>
  </body>
</html>
